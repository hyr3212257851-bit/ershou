<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园二手交易平台</title>
<style>
  /* ============ 基础重置与变量 ============ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #2563eb;
    --primary-light: #dbeafe;
    --primary-dark: #1d4ed8;
    --accent: #16a34a;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #1e293b;
    --text-2: #64748b;
    --text-3: #94a3b8;
    --border: #e2e8f0;
    --danger: #dc2626;
    --warn: #d97706;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 10px 30px rgba(0,0,0,.12);
    --radius: 10px;
    --maxw: 1100px;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font-family: inherit; cursor: pointer; }
  img { display: block; max-width: 100%; }
  input, textarea, select { font-family: inherit; font-size: 15px; }
  .hidden { display: none !important; }

  /* ============ 顶部导航 ============ */
  .topbar {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 50;
  }
  .topbar-inner {
    max-width: var(--maxw); margin: 0 auto; padding: 0 16px;
    height: 56px; display: flex; align-items: center; gap: 14px;
  }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; color: var(--text); white-space: nowrap; }
  .logo .dot { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, var(--primary), var(--accent)); display: grid; place-items: center; color: #fff; font-size: 14px; }
  .search-box { flex: 1; max-width: 420px; display: flex; align-items: center; background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; }
  .search-box input { flex: 1; border: none; background: transparent; outline: none; min-width: 60px; }
  .search-box .search-btn { border: none; background: var(--primary); color: #fff; border-radius: 999px; padding: 4px 14px; font-size: 13px; margin-left: 8px; flex-shrink: 0; transition: background .15s; }
  .search-box .search-btn:hover { background: var(--primary-dark); }
  .top-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 7px 14px; border-radius: 8px; font-size: 14px; transition: all .15s; white-space: nowrap;
  }
  .btn:hover { background: var(--bg); }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn-danger:hover { filter: brightness(1.08); }
  .btn-sm { padding: 5px 10px; font-size: 13px; }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
  .btn-ghost:hover { background: var(--bg); }

  /* ============ 容器 ============ */
  .container { max-width: var(--maxw); margin: 0 auto; padding: 18px 16px 90px; }

  /* ============ 分类筛选栏 ============ */
  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .chip {
    padding: 6px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--border);
    font-size: 14px; color: var(--text-2); cursor: pointer; transition: all .15s;
  }
  .chip:hover { border-color: var(--primary); color: var(--primary); }
  .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* ============ 商品卡片网格 ============ */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
    cursor: pointer; transition: transform .15s, box-shadow .15s; border: 1px solid var(--border);
  }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .card .thumb { width: 100%; aspect-ratio: 4/3; background: #f8fafc; overflow: hidden; position: relative; }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card .thumb .ph { width: 100%; height: 100%; display: grid; place-items: center; color: var(--text-3); font-size: 13px; background: linear-gradient(135deg,#eef2ff,#f0fdf4); }
  .card .body { padding: 12px 14px 14px; }
  .card .title { font-size: 15px; font-weight: 600; color: var(--text); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .card .desc { font-size: 12px; color: var(--text-3); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .card .price { font-size: 18px; font-weight: 700; color: var(--danger); margin-top: 8px; }
  .card .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 12px; color: var(--text-3); }
  .card .cat-tag { background: var(--primary-light); color: var(--primary-dark); padding: 2px 8px; border-radius: 4px; font-size: 11px; }
  .fav-btn { background: transparent; border: none; color: var(--text-3); font-size: 18px; padding: 4px; }
  .fav-btn.on { color: var(--danger); }

  /* 状态徽标 */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
  .badge-pending { background: #fef3c7; color: #92400e; }
  .badge-online { background: #dcfce7; color: #166534; }
  .badge-rejected { background: #fee2e2; color: #991b1b; }
  .badge-offline { background: #e2e8f0; color: #475569; }
  .badge-removed { background: #f1f5f9; color: #94a3b8; }

  /* ============ 空状态 ============ */
  .empty { text-align: center; padding: 60px 20px; color: var(--text-3); }
  .empty .ic { font-size: 40px; margin-bottom: 10px; }
  .empty .t { font-size: 16px; }

  /* ============ 底部导航(所有端常驻) ============ */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 56px; background: var(--card);
    border-top: 1px solid var(--border); display: block; z-index: 40;
    box-shadow: 0 -2px 10px rgba(0,0,0,.04);
  }
  .tabbar-inner { display: flex; max-width: 420px; margin: 0 auto; height: 100%; }
  .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-3); font-size: 11px; background: none; border: none; }
  .tab-item .ic { font-size: 20px; }
  .tab-item.active { color: var(--primary); }

  /* ============ 通用表单 ============ */
  .form-card { max-width: 560px; margin: 20px auto; background: var(--card); border-radius: var(--radius); padding: 26px 28px; box-shadow: var(--shadow); }
  .form-card.wide { max-width: 760px; }
  .form-card h2 { margin-bottom: 18px; font-size: 22px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 14px; color: var(--text-2); margin-bottom: 6px; font-weight: 500; }
  .field label .req { color: var(--danger); }
  .field input, .field textarea, .field select {
    width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; outline: none; transition: border-color .15s;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
  .field textarea { resize: vertical; min-height: 90px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .hint { font-size: 12px; color: var(--text-3); margin-top: 5px; }
  .form-actions { display: flex; gap: 10px; margin-top: 6px; }

  /* 图片上传 */
  .uploader { border: 1.5px dashed var(--border); border-radius: 8px; padding: 14px; }
  .uploader.has { border-style: solid; }
  .img-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .img-item { position: relative; width: 84px; height: 84px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  .img-item img { width: 100%; height: 100%; object-fit: cover; }
  .img-item .rm { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; border: none; font-size: 13px; line-height: 1; }
  .add-img { width: 84px; height: 84px; border: 1.5px dashed var(--border); border-radius: 8px; display: grid; place-items: center; color: var(--text-3); font-size: 24px; cursor: pointer; background: var(--bg); }
  .add-img:hover { border-color: var(--primary); color: var(--primary); }

  /* ============ 商品详情 ============ */
  .detail { display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px; }
  .detail .gallery .main-img { width: 100%; aspect-ratio: 4/3; border-radius: var(--radius); overflow: hidden; background: #f8fafc; border: 1px solid var(--border); }
  .detail .gallery .main-img img { width: 100%; height: 100%; object-fit: cover; }
  .detail .gallery .thumbs { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .detail .gallery .thumbs .t { width: 64px; height: 64px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); cursor: pointer; }
  .detail .gallery .thumbs .t img { width: 100%; height: 100%; object-fit: cover; }
  .detail .gallery .thumbs .t.active { border-color: var(--primary); }
  .detail .info h1 { font-size: 22px; margin-bottom: 8px; }
  .detail .info .price { font-size: 28px; font-weight: 700; color: var(--danger); }
  .detail .info .row { display: flex; align-items: center; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
  .detail .info .contact-box { background: var(--bg); border-radius: 8px; padding: 14px 16px; margin-top: 14px; }
  .detail .info .contact-box .lbl { font-size: 13px; color: var(--text-2); }
  .detail .info .contact-box .val { font-size: 16px; font-weight: 600; margin-top: 4px; word-break: break-all; }
  .detail .info .desc { margin-top: 18px; line-height: 1.8; white-space: pre-wrap; color: var(--text); }
  .detail .actions { display: flex; gap: 10px; margin-top: 18px; }

  /* ============ 个人中心 ============ */
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
  .tab { padding: 10px 16px; border: none; background: none; color: var(--text-2); font-size: 15px; border-bottom: 2px solid transparent; cursor: pointer; }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  .post-list { display: flex; flex-direction: column; gap: 12px; }
  .post-row { display: flex; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
  .post-row .thumb { width: 80px; height: 80px; border-radius: 8px; overflow: hidden; flex-shrink: 0; background: #f8fafc; }
  .post-row .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .post-row .thumb .ph { width: 100%; height: 100%; display: grid; place-items: center; color: var(--text-3); font-size: 11px; }
  .post-row .info { flex: 1; min-width: 0; }
  .post-row .info .t { font-weight: 600; font-size: 15px; }
  .post-row .info .p { color: var(--danger); font-weight: 700; }
  .post-row .info .m { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .post-row .ops { display: flex; gap: 6px; align-self: flex-start; flex-wrap: wrap; }
  .reject-note { font-size: 12px; color: var(--danger); margin-top: 4px; }

  /* ============ 管理员后台 ============ */
  .admin-shell { display: grid; grid-template-columns: 200px 1fr; min-height: 100vh; }
  .admin-side { background: #0f172a; color: #cbd5e1; padding: 16px 0; }
  .admin-side .brand { padding: 0 18px 18px; font-weight: 700; font-size: 16px; color: #fff; border-bottom: 1px solid #1e293b; }
  .admin-side .menu-item { display: block; width: 100%; text-align: left; padding: 11px 18px; background: none; border: none; color: #cbd5e1; font-size: 14px; }
  .admin-side .menu-item:hover, .admin-side .menu-item.active { background: #1e293b; color: #fff; }
  .admin-main { padding: 22px 28px; }
  .admin-main h2 { margin-bottom: 16px; font-size: 20px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .stat-card .num { font-size: 28px; font-weight: 700; }
  .stat-card .lbl { font-size: 13px; color: var(--text-2); margin-top: 2px; }
  .stat-card.c1 .num { color: var(--warn); }
  .stat-card.c2 .num { color: var(--accent); }
  .stat-card.c3 .num { color: var(--danger); }
  .stat-card.c4 .num { color: var(--text-2); }
  .admin-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .admin-table th, .admin-table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .admin-table th { background: #f8fafc; color: var(--text-2); font-weight: 600; }
  .admin-table tr:last-child td { border-bottom: none; }
  .admin-table td .ops { display: flex; gap: 6px; flex-wrap: wrap; }
  .admin-filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }

  /* ============ 提示框 ============ */
  .toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 200; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  /* ============ 模态框 ============ */
  .mask { position: fixed; inset: 0; background: rgba(15,23,42,.5); display: none; place-items: center; z-index: 150; padding: 20px; }
  .mask.show { display: grid; }
  .modal { background: var(--card); border-radius: var(--radius); padding: 22px 24px; max-width: 420px; width: 100%; }
  .modal h3 { margin-bottom: 12px; }
  .modal textarea { width: 100%; min-height: 80px; }

  /* ============ 聊天窗口 ============ */
  .chat-win {
    position: fixed; bottom: 0; right: 20px; width: 420px; height: 560px; max-height: calc(100vh - 20px);
    background: var(--card); border-radius: 12px 12px 0 0; box-shadow: 0 -4px 30px rgba(0,0,0,.25);
    display: flex; flex-direction: column; z-index: 180; border: 1px solid var(--border);
    resize: both; overflow: hidden; min-width: 300px; min-height: 360px;
  }
  .chat-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--bg); border-radius: 12px 12px 0 0; cursor: default; user-select: none; }
  .chat-head .av { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg,var(--primary),var(--accent)); color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 600; flex-shrink: 0; }
  .chat-head .nm { font-weight: 600; font-size: 15px; }
  .chat-head .tip { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .chat-close { margin-left: auto; border: none; background: none; font-size: 22px; color: var(--text-3); padding: 2px 6px; line-height: 1; }
  .chat-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 200px; }
  .msg-row { display: flex; gap: 8px; }
  .msg-row.me { flex-direction: row-reverse; }
  .msg-row .mav { width: 30px; height: 30px; border-radius: 50%; background: var(--primary-light); color: var(--primary-dark); display: grid; place-items: center; font-size: 13px; flex-shrink: 0; font-weight: 600; }
  .msg-row.me .mav { background: var(--primary); color: #fff; }
  .msg-bub { max-width: 75%; padding: 9px 12px; border-radius: 10px; background: var(--bg); font-size: 14px; word-break: break-word; }
  .msg-row.me .msg-bub { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
  .msg-row:not(.me) .msg-bub { border-bottom-left-radius: 4px; }
  .msg-bub .mt { font-size: 10px; opacity: .7; margin-top: 3px; }
  .msg-bub .read-tag { font-size: 10px; opacity: .85; margin-top: 1px; text-align: left; } /* 气泡左下角“已读” */
  /* Tab / 会话行未读红点 */
  .tab { position: relative; }
  .tab-dot { position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; padding: 0 4px;
    background: #ef4444; color: #fff; border-radius: 8px; font-size: 10px; line-height: 16px; text-align: center;
    font-weight: 600; border: 2px solid var(--card); box-sizing: content-box; }
  .conv-unread { background: #ef4444; color: #fff; border-radius: 10px; min-width: 20px; height: 20px;
    padding: 0 6px; display: inline-grid; place-items: center; font-size: 12px; font-weight: 600; }
  .chat-input { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
  .chat-input input { flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; outline: none; font-size: 14px; }
  .chat-input input:focus { border-color: var(--primary); }
  .chat-input button { flex-shrink: 0; padding: 8px 16px; }
  .chat-empty { text-align: center; color: var(--text-3); font-size: 13px; padding: 30px 0; }
  @media (max-width: 760px) {
    .chat-win { left: 0; right: 0; width: 100%; height: 70vh; bottom: 56px; border-radius: 12px 12px 0 0; resize: none; }
    .chat-head .tip { max-width: 150px; }
  }

  /* ============ 响应式 ============ */
  @media (max-width: 760px) {
    .topbar-inner { gap: 8px; }
    .logo { font-size: 16px; }
    .logo .full { display: none; }
    .search-box { max-width: none; }
    .top-actions .btn:not(.btn-icon) { display: none; }
    .container { padding-bottom: 70px; }
    .detail { grid-template-columns: 1fr; gap: 18px; }
    .form-row { grid-template-columns: 1fr; }
    .admin-shell { grid-template-columns: 1fr; }
    .admin-side { display: flex; overflow-x: auto; padding: 0; }
    .admin-side .brand { border-bottom: none; padding: 12px 16px; white-space: nowrap; }
    .admin-side .menu-item { white-space: nowrap; padding: 12px 14px; }
    .admin-main { padding: 16px; }
    .admin-table { font-size: 13px; }
    .admin-table th, .admin-table td { padding: 8px; }
  }
</style>
</head>
<body>
  <div id="app"></div>
  <div class="toast" id="toast"></div>
  <div class="mask" id="mask"><div class="modal" id="modal"></div></div>

<script>
/* =====================================================
 * 校园二手交易平台 —— 单文件纯网页版
 * 数据存储：浏览器 localStorage（演示用，本地独立运行）
 * 说明：所有帖子需管理员审核后上线；平台仅做信息展示，
 *       交易由买卖双方线下当面完成，无线上支付、无聊天。
 * ===================================================== */

/* ---------- 数据层 ---------- */
const KEY = {
  users: 'cm_users',
  posts: 'cm_posts',
  favs: 'cm_favs',      // { userId: [postId,...] }
  hist: 'cm_hist',      // { userId: [{postId,at}] }
  msgs: 'cm_msgs',      // 聊天（全局共享，本机演示）：{ "u1_u2_postId": [ {from:用户id, text, at} ] }
  session: 'cm_session'
};
const DB = {
  get(k, def) { try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? def : v; } catch { return def; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => Date.now();
const fmtDate = ts => {
  const d = new Date(ts);
  return `${d.getMonth()+1}-${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
};
const relTime = ts => {
  const s = (now() - ts) / 1000;
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.floor(s/60) + '分钟前';
  if (s < 86400) return Math.floor(s/3600) + '小时前';
  if (s < 86400*30) return Math.floor(s/86400) + '天前';
  return fmtDate(ts);
};

const CATEGORIES = ['书籍资料', '数码产品', '生活用品', '衣物鞋帽', '运动器材', '其他'];
const STATUS = { pending: '待审核', online: '已上线', rejected: '已驳回', offline: '已下架', removed: '已删除' };

/* ---------- 种子数据 ---------- */
function seed() {
  if (DB.get(KEY.users)) return; // 已初始化
  const users = [
    { id: 'u_admin', phone: 'admin', password: 'admin123', name: '管理员', role: 'admin' },
    { id: 'u_001', phone: '13800138000', password: '123456', name: '小明同学', role: 'student' },
    { id: 'u_002', phone: '13900139000', password: '123456', name: '学霸小李', role: 'student' }
  ];
  DB.set(KEY.users, users);

  /* 种子商品图片：本地 images/ 目录下的实拍图（离线可用） */
  const IMG = {
    gaoshu: 'images/gaoshu.jpg',
    pad: 'images/pad.jpg',
    lamp: 'images/lamp.jpg',
    tshirt: 'images/tshirt.jpg',
    racket: 'images/racket.jpg',
    cet4: 'images/cet4.jpg',
    mouse: 'images/mouse.jpg'

/* ---------- 聊天（全局共享，本机演示） ----------
 * 会话按「买家id + 卖家id + 商品id」唯一标识，消息带发送者id。
 * 说明：纯前端演示，数据存本机 localStorage。买家发消息后，
 * 卖家登录（同一浏览器）即可在「我的消息」里看到并回复。 */
/* 会话键：用「|」分隔，避免用户id/帖子id中的下划线干扰解析 */
function convKey(a, b, pid) { const [x,y] = a < b ? [a,b] : [b,a]; return x + '|' + y + '|' + pid; }
function getConv(a, b, pid) { return DB.get(KEY.msgs, {})[convKey(a, b, pid)] || []; }
function pushMsg(fromId, toId, pid, text) {
  const all = DB.get(KEY.msgs, {});
  const k = convKey(fromId, toId, pid);
  if (!all[k]) all[k] = [];
  all[k].push({ from: fromId, text, at: now(), read: false }); // read：接收方是否已读
  DB.set(KEY.msgs, all);
}
/* 标记会话中「对方发给我」的消息为已读（进入聊天窗口时调用，持久化） */
function markConvRead(uid, otherId, pid) {
  const all = DB.get(KEY.msgs, {});
  const k = convKey(uid, otherId, pid);
  if (!all[k]) return;
  let changed = false;
  all[k].forEach(m => { if (m.from !== uid && !m.read) { m.read = true; changed = true; } });
  if (changed) DB.set(KEY.msgs, all);
}
/* 当前用户参与的所有会话（我是买家或卖家），用于“我的消息”列表 */
function getConvsFor(uid) {
  const all = DB.get(KEY.msgs, {});
  const list = [];
  for (const k in all) {
    const parts = k.split('|');
    if (parts.length !== 3) continue; // 跳过旧格式脏数据
    const [a, b, pid] = parts;
    if (a !== uid && b !== uid) continue;
    const otherId = a === uid ? b : a;
    const post = getPost(pid);
    const other = getUser(otherId);
    const msgs = all[k];
    const last = msgs[msgs.length - 1];
    const unread = msgs.filter(m => m.from !== uid && !m.read).length; // 对方发来我未读
    list.push({
      key: k, otherId, otherName: other ? other.name : '用户', postId: pid,
      postTitle: post ? post.title : '(商品已删除)',
      lastText: last ? last.text : '', lastAt: last ? last.at : 0, unread, msgs
    });
  }
  return list.sort((x, y) => y.lastAt - x.lastAt);
}
/* 当前用户所有会话的未读消息总数（用于红点） */
function getUnreadTotal(uid) {
  return getConvsFor(uid).reduce((n, c) => n + c.unread, 0);
}

/* ---------- 图片压缩(上传) ---------- */
function resizeImage(file, maxW, cb) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxW) { h = h * maxW / w; w = maxW; }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(c.toDataURL('image/jpeg', 0.7));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function parseHash() {
  const h = location.hash.replace(/^#/, '') || '/';
  const parts = h.split('/').filter(Boolean); // ['detail', 'xxx'] 等
  if (parts.length === 0) route = { path: '/', params: {} };
  else if (parts[0] === 'detail' && parts[1]) route = { path: '/detail', params: { id: parts[1] } };
  else if (parts[0] === 'publish') route = { path: '/publish', params: { id: parts[1] || null } };
  else if (parts[0] === 'personal') route = { path: '/personal', params: {} };
  else if (parts[0] === 'login') route = { path: '/login', params: {} };
  else if (parts[0] === 'admin') {
    if (parts[1] === 'login') route = { path: '/admin/login', params: {} };
    else route = { path: '/admin', params: { tab: parts[1] || 'overview' } };
  }
  else route = { path: '/', params: {} };
  render();
}

 * 聊天窗口（全局共享，本机演示）

let chat = null; // { postId, otherId }

function openChat(pid, otherId) {
  const s = currentUser(); if (!s) { nav('/login'); return; }
  const p = getPost(pid); if (!p) return;
  if (!otherId) otherId = p.sellerId; // 详情页进入时默认找卖家
  closeChat(true); // 先清掉旧的浮窗（静默，避免重复渲染）
  chat = { postId: pid, otherId };    // 清完再赋值，保证不被重置
  const other = getUser(otherId) || { name: '用户' };
  const win = document.createElement('div');
  win.className = 'chat-win';
  win.id = 'chatWin';
  win.innerHTML = `
    <div class="chat-head">
      <div class="av">${esc(other.name.slice(0,1))}</div>
      <div style="min-width:0;flex:1">
        <div class="nm">${esc(other.name)}</div>
        <div class="tip">咨询：${esc(p.title)}</div>
      </div>
      <button class="chat-close" onclick="closeChat()">×</button>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-input">
      <input id="chatText" placeholder="输入消息，回车发送..." autocomplete="off">
      <button class="btn btn-primary btn-sm" onclick="sendChat()">发送</button>
    </div>`;
  document.body.appendChild(win);
  markConvRead(s.id, chat.otherId, chat.postId); // 进入会话：对方消息全部标记已读并持久化
  renderMsgs();
  const inp = document.getElementById('chatText');
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
  inp.focus();
}
function renderMsgs() {
  const s = currentUser(); if (!s || !chat) return;
  const body = document.getElementById('chatBody');
  if (!body) return;
  const msgs = getConv(s.id, chat.otherId, chat.postId);
  const myName = getUser(s.id)?.name || '我';
  const otherName = getUser(chat.otherId)?.name || '对方';
  body.innerHTML = msgs.length
    ? msgs.map(m => {
        const isMe = m.from === s.id;
        return `
        <div class="msg-row ${isMe?'me':''}">
          <div class="mav">${esc((isMe?myName:otherName).slice(0,1))}</div>
          <div class="msg-bub">${esc(m.text)}<div class="mt">${relTime(m.at)}</div>${isMe && m.read ? '<div class="read-tag">已读</div>' : ''}</div>
        </div>`;
      }).join('')
    : `<div class="chat-empty">还没有消息，打个招呼吧～<br><span style="font-size:11px">（演示功能：消息仅保存在本机）</span></div>`;
  body.scrollTop = body.scrollHeight;
}
function sendChat() {
  const s = currentUser(); if (!s || !chat) return;
  const inp = document.getElementById('chatText');
  const text = inp.value.trim();
  if (!text) return;
  pushMsg(s.id, chat.otherId, chat.postId, text);
  inp.value = '';
  renderMsgs();
  inp.focus();
}
function closeChat(silent) {
  const w = document.getElementById('chatWin');
  if (w) w.remove();
  const wasOpen = chat !== null;
  chat = null;
  // 关闭后若停留在个人中心，刷新一次让红点/未读数即时消失
  if (!silent && wasOpen && location.hash.indexOf('/personal') === 1) viewPersonal();
}

function submitPost(editId) {
  const title = document.getElementById('f-title').value.trim();
  const price = document.getElementById('f-price').value.trim();
  const cat = document.getElementById('f-cat').value;
  const desc = document.getElementById('f-desc').value.trim();
  const contact = document.getElementById('f-contact').value.trim();
  if (!title || !price || !desc || !contact) { toast('请填写完整必填项'); return; }
  if (Number(price) < 0) { toast('售价不能为负'); return; }
  const s = currentUser(); const u = getUser(s.id);

  if (editId) {
    // 编辑：若已上线改为下架待重审，否则保持待审核
    const old = getPost(editId);
    updatePost(editId, { title, price: Number(price), category: cat, desc, images: [...uploadImages], contact, status: old.status==='online'?'pending':old.status });
    toast('已保存，重新提交审核');
  } else {
    const post = { id: uid(), title, price: Number(price), category: cat, desc, images: [...uploadImages], contact, sellerId: s.id, sellerName: u.name, status: 'pending', createdAt: now() };
    const arr = getPosts(); arr.unshift(post); savePosts(arr);
    toast('提交成功，等待管理员审核');
  }
  nav('/personal');
}

function postRowHTML(p, clickable=false, viewedAt=null) {
  const thumb = p.images && p.images[0] ? `<img src="${p.images[0]}">` : `<div class="ph">无图</div>`;
  const ops = [];
  if (p.sellerId === currentUser().id) {

    if (p.status === 'rejected') ops.push(`<button class="btn btn-sm btn-primary" onclick="resubmit('${p.id}')">重新提交</button>`);
    ops.push(`<button class="btn btn-sm btn-danger" onclick="delOwn('${p.id}')">删除</button>`);
  }
  const rej = p.status==='rejected' && p.rejectReason ? `<div class="reject-note">驳回原因：${esc(p.rejectReason)}</div>` : '';
  const click = clickable ? `onclick="nav('/detail/${p.id}')"` : (p.sellerId===currentUser().id?`onclick="nav('/detail/${p.id}')"`:'');
  return `
    <div class="post-row" ${click?'style="cursor:pointer"':''} ${click?`onclick="nav('/detail/${p.id}')"`:''}>

      <div class="info">

        </div>

      </div>
      <div class="ops" onclick="event.stopPropagation()">${ops.join('')}</div>
    </div>`;
}

  } else {
    const list = posts.sort((a,b)=>b.createdAt-a.createdAt);
    main = `<h2>全部帖子管理</h2><p class="hint" style="margin-bottom:14px">共 ${list.length} 条 · 可执行下架、删除等违规内容清理操作</p>${list.length?adminTableHTML(list):emptyHTML('暂无帖子')}`;
  }

  app.innerHTML = `
    ${side}
    <div class="admin-main">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
        <h2 style="margin:0">${u.name}，欢迎</h2>
        <div><button class="btn btn-sm" onclick="nav('/')">前往前台</button> <button class="btn btn-sm" onclick="logout();nav('/admin/login')">退出</button></div>
      </div>
      ${main}
    </div>`;
}
function adminTableHTML(list) {
  const rows = list.map(p => {
    const thumb = p.images&&p.images[0] ? `<img src="${p.images[0]}" style="width:50px;height:38px;object-fit:cover;border-radius:4px">` : '<span style="color:var(--text-3)">无图</span>';
    const ops = [];
    if (p.status === 'pending') {
      ops.push(`<button class="btn btn-sm btn-primary" onclick="approve('${p.id}')">通过</button>`);
      ops.push(`<button class="btn btn-sm btn-danger" onclick="reject('${p.id}')">驳回</button>`);
    }
    if (p.status === 'online') ops.push(`<button class="btn btn-sm" onclick="takeOffline('${p.id}')">下架</button>`);
    if (p.status === 'rejected') ops.push(`<button class="btn btn-sm btn-primary" onclick="approve('${p.id}')">通过</button>`);
    ops.push(`<button class="btn btn-sm btn-danger" onclick="adminDel('${p.id}')">删除</button>`);
    return `<tr>
      <td>${thumb}</td>
      <td><div style="font-weight:600">${esc(p.title)}</div><div style="color:var(--text-3);font-size:12px">${esc(p.category)} · ¥${esc(p.price)}</div></td>
      <td>${esc(p.sellerName)}</td>
      <td><span class="badge badge-${p.status}">${STATUS[p.status]}</span>${p.rejectReason?`<div class="reject-note">${esc(p.rejectReason)}</div>`:''}</td>
      <td style="color:var(--text-3)">${relTime(p.createdAt)}</td>
      <td><div class="ops">${ops.join('')}</div></td>
    </tr>`;
  }).join('');
  return `<table class="admin-table"><thead><tr><th>图片</th><th>标题</th><th>发布人</th><th>状态</th><th>时间</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function approve(id) { updatePost(id, { status: 'online', rejectReason: '' }); toast('已审核通过，帖子上线'); viewAdmin(); }
function reject(id) {
  openModal(`
    <h3>驳回帖子</h3>
    <div class="field" style="margin:0"><textarea id="rejReason" placeholder="请填写驳回原因（如：广告引流、信息不实、违禁物品等）"></textarea></div>
    <div class="form-actions" style="margin-top:14px"><button class="btn btn-danger" onclick="confirmReject('${id}')">确认驳回</button><button class="btn" onclick="closeModal()">取消</button></div>
  `);
}
function confirmReject(id) {
  const reason = document.getElementById('rejReason').value.trim() || '内容不符合平台规范';
  updatePost(id, { status: 'rejected', rejectReason: reason });
  closeModal(); toast('已驳回，原因已通知用户'); viewAdmin();
}
function takeOffline(id) { updatePost(id, { status: 'offline' }); toast('已下架'); viewAdmin(); }
function adminDel(id) {
  openModal(`<h3>删除帖子</h3><p style="color:var(--text-2);margin-bottom:16px">删除违规帖子后将无法恢复，确认删除？</p>
    <div class="form-actions"><button class="btn btn-danger" onclick="confirmAdminDel('${id}')">确认删除</button><button class="btn" onclick="closeModal()">取消</button></div>`);
}
function confirmAdminDel(id) { deletePost(id); closeModal(); toast('已删除违规帖子'); viewAdmin(); }

/* =====================================================
 * 启动
 * ===================================================== */
seed();
upgradeSeedImages();
window.addEventListener('hashchange', parseHash);
parseHash();
</script>
</body>
</html>
